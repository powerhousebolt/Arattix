name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Enables test/redis.test.ts (BullMQ queues, Redis store, session lease, split roles).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The server depends on the library via "file:..", which needs the library's own
      # dependencies installed at the repo root. The root ships without a lockfile.
      - name: Install library dependencies
        run: npm install --omit=dev --no-audit --no-fund --ignore-scripts --no-package-lock

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Build
        working-directory: server
        run: npm run build

      - name: Test
        working-directory: server
        run: npm test

  docker:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: server/Dockerfile
            tag: arattix-server:ci
          - name: bot
            dockerfile: Dockerfile
            tag: arattix-bot:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.tag }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke test the server image
        if: matrix.name == 'server'
        run: |
          docker run -d --name srv -p 3000:3000 \
            -e API_KEYS=ci-api-key-0123456789abcdef \
            -e MASTER_KEY="$(openssl rand -hex 32)" \
            -e POLL_ENABLED=false \
            ${{ matrix.tag }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health/live; then echo; exit 0; fi
            sleep 1
          done
          docker logs srv
          exit 1
