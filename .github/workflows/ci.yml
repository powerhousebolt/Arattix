name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Enables test/redis.test.ts (BullMQ queues, Redis store, session lease, split roles).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The server depends on the library via "file:..", which needs the library's own
      # dependencies installed at the repo root. The root ships without a lockfile.
      - name: Install library dependencies
        run: npm install --omit=dev --no-audit --no-fund --ignore-scripts --no-package-lock

      - name: Library tests
        run: npm run test:lib

      - name: Check example scripts
        run: for f in Example/*.js; do node --check "$f"; done

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Build
        working-directory: server
        run: npm run build

      - name: Check admin UI scripts
        working-directory: server
        run: for f in public/*.js; do node --check "$f"; done

      - name: Test
        working-directory: server
        run: npm test

      # Boots the compiled server the way production does and exercises the admin UI and its API.
      - name: Smoke test the built server and admin UI
        working-directory: server
        env:
          API_KEYS: ci-api-key-0123456789abcdef
          POLL_ENABLED: 'false'
          DATA_DIR: ${{ runner.temp }}/arattix-data
          PORT: '3000'
        run: |
          export MASTER_KEY="$(openssl rand -hex 32)"
          node dist/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health/live >/dev/null && break; sleep 1; done
          auth="Authorization: Bearer $API_KEYS"
          curl -fsS -o "$RUNNER_TEMP/ui.html" http://127.0.0.1:3000/ui/ && grep -q 'app.js' "$RUNNER_TEMP/ui.html"
          curl -fsS -o /dev/null http://127.0.0.1:3000/ui/app.js
          curl -fsS -H "$auth" http://127.0.0.1:3000/api/v1/system | jq -e '.data.role == "all" and .data.session.workerOnline'
          curl -fsS -H "$auth" 'http://127.0.0.1:3000/api/v1/jobs?limit=5' | jq -e '.data | type == "array"'
          curl -fsS -H "$auth" 'http://127.0.0.1:3000/api/v1/logs?limit=5' | jq -e '.data.entries | length > 0'
          curl -fsS -H "$auth" http://127.0.0.1:3000/api/v1/settings | jq -e '.data.settings | length > 50'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/system)" = 401
          kill "$pid"

      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: arattix-server-build
          path: |
            server/dist
            server/public
            server/package.json
            server/package-lock.json
          retention-days: 14

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true

  docker:
    name: Docker image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: server/Dockerfile
            tag: arattix-server:ci
          - name: bot
            dockerfile: Dockerfile
            tag: arattix-bot:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.tag }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Smoke test the server image
        if: matrix.name == 'server'
        run: |
          docker run -d --name srv -p 3000:3000 \
            -e API_KEYS=ci-api-key-0123456789abcdef \
            -e MASTER_KEY="$(openssl rand -hex 32)" \
            -e POLL_ENABLED=false \
            ${{ matrix.tag }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health/live; then echo; break; fi
            if [ "$i" = 30 ]; then docker logs srv; exit 1; fi
            sleep 1
          done
          # The image must ship the admin UI next to the compiled server.
          curl -fsS -o ui.html http://127.0.0.1:3000/ui/ && grep -q 'app.js' ui.html || { docker logs srv; exit 1; }
          curl -fsS -H 'Authorization: Bearer ci-api-key-0123456789abcdef' http://127.0.0.1:3000/api/v1/system | jq -e '.data.version' \
            || { docker logs srv; exit 1; }

  # Publishes the server image to GitHub Container Registry for main and version tags only
  # (never for pull requests), after tests and image builds pass.
  publish:
    name: Publish server image
    if: github.event_name == 'push'
    needs: [server, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/arattix-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
